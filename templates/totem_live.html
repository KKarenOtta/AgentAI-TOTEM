{% extends "base.html" %}
{% block content %}
<h1>Monitor ao vivo • {{ company_id }}</h1>

<div class="grid">
  <div class="card">
    <h2>Última interação</h2>
    <div><b>Pergunta:</b></div>
    <pre id="q">—</pre>
    <div><b>Resposta:</b></div>
    <pre id="r">—</pre>
  </div>

  <div class="card">
    <h2>Feed (realtime)</h2>
    <div id="feed" class="feed"></div>
  </div>
</div>

<script>
const es = new EventSource(`/api/events/{{ company_id }}`);

es.onmessage = (msg) => {
  const ev = JSON.parse(msg.data);
  if(ev.type === "keepalive") return;

  document.querySelector("#q").textContent = ev.question || "";
  document.querySelector("#r").textContent = ev.response || "";

  const feed = document.querySelector("#feed");
  const item = document.createElement("div");
  item.className = "feed-item";
  item.textContent = `[${ev.timestamp}] ${ev.profile?.age_range || "?"} • ${ev.question}`;
  feed.prepend(item);
};
</script>
{% endblock %}
