<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Totem • AgentAI</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="totem-public-body">

<main class="container">
  <section class="totem-stage">

    <div class="totem-orb" id="orb"></div>

    <h1 id="title">Aguardando presença...</h1>
    <p class="muted" id="subtitle">O sistema será ativado automaticamente.</p>

    <div id="marketingOptions" class="quick-row"></div>

    <div class="card" style="margin-top:20px;max-width:900px;margin-left:auto;margin-right:auto;">
      <textarea id="message" rows="3" placeholder="Digite aqui..." disabled></textarea>
      <div class="actions">
        <button class="btn primary" onclick="sendMessage()" disabled id="btnSend">Enviar</button>
        <button class="btn" onclick="clearInput()">Limpar</button>
      </div>
    </div>

    <div class="card" style="margin-top:20px;max-width:900px;margin-left:auto;margin-right:auto;">
      <h2>Resposta</h2>
      <div id="answer" class="answer-box">Aguardando ativação...</div>
    </div>

  </section>
</main>

<script>
const companyId = "{{ company_id }}";
const sessionId = "totem-ui-" + Date.now();

let currentAudio = null;
let activated = false;
let eventSource = null;

function setStatus(title, subtitle, answer) {
  document.getElementById("title").textContent = title;
  document.getElementById("subtitle").textContent = subtitle || "";
  if (answer !== undefined) {
    document.getElementById("answer").textContent = answer;
  }
}

function stopAudio() {
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
}

function enableUI() {
  document.getElementById("message").disabled = false;
  document.getElementById("btnSend").disabled = false;
  setStatus("Como posso ajudar hoje?", "", document.getElementById("answer").textContent);
}

async function activateTotem() {
  if (activated) return;
  activated = true;

  setStatus("Presença detectada", "Ativando atendimento...", "Preparando saudação...");

  try {
    const res = await fetch("/totem/activate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        company_id: companyId,
        session_id: sessionId,
        prefer_audio: true
      })
    });

    if (!res.ok) {
      throw new Error("Falha HTTP em /totem/activate: " + res.status);
    }

    const data = await res.json();

    document.getElementById("answer").textContent = data.greeting || "Olá! Como posso ajudar hoje?";
    enableUI();

    if (data.audio_base64) {
      currentAudio = new Audio("data:audio/mp3;base64," + data.audio_base64);
      currentAudio.play().catch(() => {});
    }
  } catch (error) {
    console.error("Erro ao ativar totem:", error);
    document.getElementById("answer").textContent = "Olá! Como posso ajudar hoje?";
    enableUI();
  }
}

function connectSSE() {
  eventSource = new EventSource(`/api/events/${companyId}`);

  eventSource.onopen = function() {
    console.log("SSE conectado");
  };

  eventSource.onmessage = function(event) {
    try {
      const data = JSON.parse(event.data);
      console.log("SSE recebido:", data);

      if (data.type === "presence_triggered") {
        activateTotem();
      }
    } catch (error) {
      console.error("Erro ao processar SSE:", error);
    }
  };

  eventSource.onerror = function(error) {
    console.warn("Erro SSE:", error);
  };
}

async function sendMessage() {
  stopAudio();

  const message = document.getElementById("message").value.trim();
  if (!message) return;

  const res = await fetch("/totem/interact", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      company_id: companyId,
      session_id: sessionId,
      message,
      prefer_audio: true
    })
  });

  const data = await res.json();

  document.getElementById("answer").textContent = data.text || "";

  if (data.audio_base64) {
    currentAudio = new Audio("data:audio/mp3;base64," + data.audio_base64);
    currentAudio.play().catch(() => {});
  }

  document.getElementById("message").value = "";
}

function clearInput() {
  document.getElementById("message").value = "";
}

connectSSE();
</script>

</body>
</html>
