<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TOTEM IA.GORA</title>

  <link rel="stylesheet" href="/static/css/app.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #071018;
      color: #eef3f8;
      font-family: Inter, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .panel {
      width: min(980px, 100%);
      border-radius: 28px;
      padding: 42px;
      background:
        radial-gradient(circle at top, rgba(39,224,161,.14), transparent 34%),
        linear-gradient(180deg, rgba(24,33,44,.96), rgba(10,15,22,.98));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .orb {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background:
        radial-gradient(circle,
          #27e0a1 0%,
          #127553 52%,
          rgba(39,224,161,.08) 72%
        );
      box-shadow: 0 0 64px rgba(39,224,161,.45);
      opacity: .5;
      transition: .25s ease;
    }

    .orb.active {
      opacity: 1;
      transform: scale(1.06);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .subtitle {
      text-align: center;
      opacity: .8;
      margin-top: 12px;
      font-size: 1.2rem;
    }

    .answer {
      margin-top: 32px;
      padding: 26px;
      border-radius: 22px;
      background: rgba(4,8,14,.52);
      border: 1px solid rgba(255,255,255,.08);
      min-height: 120px;
      font-size: 1.4rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    textarea {
      width: 100%;
      margin-top: 24px;
      min-height: 110px;
      border-radius: 18px;
      padding: 18px;
      background: rgba(0,0,0,.28);
      color: white;
      border: 1px solid rgba(255,255,255,.08);
      resize: vertical;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: #27e0a1;
      color: #04130d;
    }

    .secondary {
      background: rgba(255,255,255,.12);
      color: #eef3f8;
      border: 1px solid rgba(255,255,255,.12);
    }

    .hidden {
      display: none !important;
    }

    .qr {
      width: 220px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin: 24px auto 0;
      display: block;
    }

    .link {
      word-break: break-all;
      text-align: center;
      margin-top: 14px;
      font-weight: 700;
      color: #27e0a1;
    }

    .debug {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      color: rgba(238,243,248,.72);
      font-size: .85rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="panel">

      <div class="orb" id="orb"></div>

      <h1 id="title">Aguardando presença...</h1>

      <p class="subtitle" id="subtitle">
        Ative o áudio uma vez para permitir fala automática.
      </p>

      <div class="answer" id="answer">
        Clique em “Ativar áudio” e aproxime-se do totem.
      </div>

      <div class="actions">
        <button class="primary" id="btnAudio">Ativar áudio</button>

        <button class="primary hidden" id="btnVoice">Fazer pergunta</button>

        <button class="hidden" id="btnFinish">Encerrar atendimento</button>
      </div>

      <textarea
        id="message"
        class="hidden"
        placeholder="Digite sua pergunta..."
      ></textarea>

      <div class="actions hidden" id="textActions">
        <button class="primary" id="btnSendText">Enviar texto</button>
      </div>

      <div id="finalBlock" class="hidden">
        <img id="qr" class="qr hidden"/>
        <div id="handoff" class="link"></div>
      </div>

      <div class="debug" id="debug">
        SSE: inicializando
      </div>

    </section>
  </main>

  <script>
    const companyId = "{{ company_id }}";

    const AUTO_LISTEN_AFTER_GREETING = true;
    const PLAY_AUDIO_ON_INTERACTION_COMPLETED = false;

    let sessionId = null;
    let currentAudio = null;
    let sse = null;
    let reconnectTimer = null;
    let voiceBusy = false;
    let audioUnlocked = false;
    let audioContext = null;
    let autoListenScheduled = false;

    const greetedSessions = new Set();
    const playedAudioKeys = new Set();

    function el(id) {
      return document.getElementById(id);
    }

    function show(id) {
      el(id).classList.remove("hidden");
    }

    function hide(id) {
      el(id).classList.add("hidden");
    }

    function debug(message) {
      el("debug").textContent = message;
      console.log("[TOTEM_UI]", message);
    }

    function setStatus(title, subtitle, answer) {
      el("title").textContent = title;
      el("subtitle").textContent = subtitle || "";
      el("answer").textContent = answer || "";
    }

    function setActive(active) {
      el("orb").classList.toggle("active", !!active);
    }

    function setVoiceBusy(active) {
      voiceBusy = !!active;
      el("btnVoice").disabled = voiceBusy;
      el("btnSendText").disabled = voiceBusy;
    }

    function stopAudio() {
      if (!currentAudio) return;

      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    function resetSessionState() {
      stopAudio();

      if (sessionId) {
        greetedSessions.delete(sessionId);
      }

      playedAudioKeys.clear();

      autoListenScheduled = false;
      setVoiceBusy(false);

      disableInteraction();

      hide("finalBlock");
      hide("qr");

      setActive(false);

      sessionId = null;
    }

    async function unlockAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
          audioContext = audioContext || new AudioContextClass();

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
        }

        const testAudio = new Audio(
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
        );

        testAudio.muted = true;
        await testAudio.play().catch(() => {});

        audioUnlocked = true;
        hide("btnAudio");

        debug("Áudio desbloqueado | SSE pronto | aguardando presença");

        if (!sessionId) {
          setStatus(
            "Aguardando presença...",
            "Áudio ativado. O sistema será iniciado automaticamente.",
            "Aguardando ativação..."
          );
        }

        return true;
      } catch (e) {
        audioUnlocked = false;
        debug("Falha ao desbloquear áudio: " + e.message);

        setStatus(
          "Áudio bloqueado",
          "Clique em Ativar áudio novamente.",
          "O navegador bloqueou a reprodução automática."
        );

        return false;
      }
    }

    async function playAudio(audioBase64, key) {
      stopAudio();

      if (!audioBase64) {
        debug("Audio ausente");
        return false;
      }

      const audioKey = key || String(audioBase64.length);

      if (playedAudioKeys.has(audioKey)) {
        debug("Áudio ignorado por duplicidade: " + audioKey);
        return false;
      }

      playedAudioKeys.add(audioKey);

      return new Promise((resolve) => {
        try {
          function tryPlay(mimeType) {
            currentAudio = new Audio(
              `data:${mimeType};base64,${audioBase64}`
            );

            currentAudio.onended = () => {
              debug("Áudio finalizado: " + audioKey);
              resolve(true);
            };

            currentAudio.onerror = async () => {
              debug("Falha ao reproduzir como " + mimeType);

              if (mimeType === "audio/mp3") {
                try {
                  tryPlay("audio/wav");
                  return;
                } catch (_) {}
              }

              playedAudioKeys.delete(audioKey);
              resolve(false);
            };

            const playPromise = currentAudio.play();

            if (playPromise && typeof playPromise.catch === "function") {
              playPromise.catch((error) => {
                debug("Audio.play bloqueado: " + error.message);

                playedAudioKeys.delete(audioKey);

                show("btnAudio");

                setStatus(
                  "Áudio bloqueado",
                  "Clique em Ativar áudio para continuar.",
                  "O navegador bloqueou a reprodução automática."
                );

                resolve(false);
              });
            }
          }

          tryPlay("audio/mp3");

        } catch (e) {
          playedAudioKeys.delete(audioKey);
          debug("Falha ao preparar áudio: " + e.message);
          resolve(false);
        }
      });
    }

    function enableInteraction() {
      show("btnVoice");
      show("btnFinish");
      show("message");
      show("textActions");
    }

    function disableInteraction() {
      hide("btnVoice");
      hide("btnFinish");
      hide("message");
      hide("textActions");
      setVoiceBusy(false);
    }

    function connectSSE() {
      sse = new EventSource(`/api/events/${companyId}`);

      sse.onmessage = handleSSEMessage;

      sse.onerror = () => {
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectSSE, 2000);
      };
    }

    function handleSSEMessage(event) {
      const data = JSON.parse(event.data);
    
      debug("EVENTO RECEBIDO: " + JSON.stringify(data));
    
      if (data.type === "greeting") {
        setStatus(
          "Atendimento iniciado",
          "",
          data.greeting
        );
    
        setActive(true);
    
        enableInteraction();
    
        if (data.audio_base64) {
          playAudio(data.audio_base64, data.session_id);
        }
      }
    
      if (data.type === "reset") {
        resetSessionState();
      }
    }
    
  window.addEventListener("load", () => {
        connectSSE();
      
        el("btnAudio").addEventListener("click", async () => {
          await unlockAudio();
        });
      });
    
  </script>
</body>
</html>
