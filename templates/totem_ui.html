<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TOTEM IA.GORA</title>

  <link rel="stylesheet" href="/static/css/app.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #071018;
      color: #eef3f8;
      font-family: Inter, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .panel {
      width: min(980px, 100%);
      border-radius: 28px;
      padding: 42px;
      background:
        radial-gradient(circle at top, rgba(39,224,161,.14), transparent 34%),
        linear-gradient(180deg, rgba(24,33,44,.96), rgba(10,15,22,.98));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .orb {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background:
        radial-gradient(circle,
        #27e0a1 0%,
        #127553 52%,
        rgba(39,224,161,.08) 72%);
      box-shadow: 0 0 64px rgba(39,224,161,.45);
      opacity: .5;
      transition: .25s ease;
    }

    .orb.active {
      opacity: 1;
      transform: scale(1.06);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .subtitle {
      text-align: center;
      opacity: .8;
      margin-top: 12px;
      font-size: 1.2rem;
    }

    .answer {
      margin-top: 32px;
      padding: 26px;
      border-radius: 22px;
      background: rgba(4,8,14,.52);
      border: 1px solid rgba(255,255,255,.08);
      min-height: 120px;
      font-size: 1.4rem;
      line-height: 1.5;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    textarea {
      width: 100%;
      margin-top: 24px;
      min-height: 110px;
      border-radius: 18px;
      padding: 18px;
      background: rgba(0,0,0,.28);
      color: white;
      border: 1px solid rgba(255,255,255,.08);
      resize: vertical;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    .primary {
      background: #27e0a1;
      color: #04130d;
    }

    .hidden {
      display: none !important;
    }

    .qr {
      width: 220px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin: 24px auto 0;
      display: block;
    }

    .link {
      word-break: break-all;
      text-align: center;
      margin-top: 14px;
      font-weight: 700;
      color: #27e0a1;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="panel">

      <div class="orb" id="orb"></div>

      <h1 id="title">Aguardando presença...</h1>

      <p class="subtitle" id="subtitle">
        O sistema será ativado automaticamente.
      </p>

      <div class="answer" id="answer">
        Aguardando ativação...
      </div>

      <div class="actions">
        <button class="primary hidden" id="btnVoice">
          Fazer pergunta
        </button>

        <button class="hidden" id="btnFinish">
          Encerrar atendimento
        </button>
      </div>

      <textarea
        id="message"
        class="hidden"
        placeholder="Digite sua pergunta..."
      ></textarea>

      <div class="actions hidden" id="textActions">
        <button class="primary" id="btnSendText">
          Enviar texto
        </button>
      </div>

      <div id="finalBlock" class="hidden">
        <img id="qr" class="qr hidden"/>
        <div id="handoff" class="link"></div>
      </div>

    </section>
  </main>

  <script>
    const companyId = "{{ company_id }}";

    let sessionId = null;
    let activated = false;
    let currentAudio = null;

    function el(id) {
      return document.getElementById(id);
    }

    function show(id) {
      el(id).classList.remove("hidden");
    }

    function hide(id) {
      el(id).classList.add("hidden");
    }

    function setStatus(title, subtitle, answer) {
      el("title").textContent = title;
      el("subtitle").textContent = subtitle;
      el("answer").textContent = answer;
    }

    function setActive(active) {
      el("orb").classList.toggle("active", !!active);
    }

    function stopAudio() {
      if (!currentAudio) return;

      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    async function playAudio(audioBase64) {
      stopAudio();

      if (!audioBase64) return;

      return new Promise((resolve) => {
        try {
          currentAudio = new Audio(
            "data:audio/mp3;base64," + audioBase64
          );

          currentAudio.onended = () => resolve();
          currentAudio.onerror = () => resolve();

          currentAudio.play().catch(() => resolve());
        } catch (e) {
          resolve();
        }
      });
    }

    async function activateTotem() {
      if (activated) return;

      activated = true;

      setActive(true);

      setStatus(
        "Presença detectada",
        "Ativando atendimento...",
        "Preparando saudação..."
      );

      try {
        const response = await fetch("/totem/activate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            company_id: companyId,
            session_id: sessionId,
            prefer_audio: true
          })
        });

        const data = await response.json();

        const greeting =
          data.greeting ||
          "Olá! Como posso ajudar você hoje?";

        setStatus(
          "Como posso ajudar?",
          "Fale ou digite sua pergunta.",
          greeting
        );

        show("btnVoice");
        show("btnFinish");
        show("message");
        show("textActions");

        await playAudio(data.audio_base64);

      } catch (e) {
        console.error(e);

        setStatus(
          "Erro",
          "Falha ao ativar atendimento.",
          "Não foi possível iniciar o totem."
        );
      }
    }

    async function startVoiceQuestion() {
      setStatus(
        "Escutando...",
        "Fale sua pergunta agora.",
        "Capturando áudio..."
      );

      try {
        await fetch(
          `/api/voice/capture?session_id=${encodeURIComponent(sessionId)}`,
          {
            method: "POST"
          }
        );
      } catch (e) {
        console.error(e);

        setStatus(
          "Erro",
          "",
          "Falha ao capturar áudio."
        );
      }
    }

    async function sendTextQuestion() {
      const message = el("message").value.trim();

      if (!message) return;

      setStatus(
        "Processando...",
        "",
        message
      );

      try {
        const response = await fetch("/totem/interact", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            company_id: companyId,
            session_id: sessionId,
            message,
            prefer_audio: true
          })
        });

        const data = await response.json();

        setStatus(
          "Resposta",
          "Você pode fazer outra pergunta.",
          data.text || "Resposta pronta."
        );

        await playAudio(data.audio_base64);

      } catch (e) {
        console.error(e);

        setStatus(
          "Erro",
          "",
          "Falha ao processar pergunta."
        );
      }
    }

    async function finishSession() {
      const response = await fetch("/totem/end", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          company_id: companyId,
          session_id: sessionId,
          reason: "completed"
        })
      });

      const data = await response.json();

      setStatus(
        "Atendimento finalizado",
        "Continue no celular.",
        data.message || "Escaneie o QR Code."
      );

      if (data.handoff_qr_url) {
        el("qr").src = data.handoff_qr_url;
        show("qr");
      }

      el("handoff").textContent =
        data.handoff_url || "";

      show("finalBlock");
    }

    function connectSSE() {
      const sse = new EventSource(
        `/api/events/${companyId}`
      );

      sse.onmessage = async (event) => {
        try {
          const data = JSON.parse(event.data);

          console.log("SSE", data);

          if (
            data.type === "presence_detected" ||
            data.type === "presence_triggered"
          ) {
            activateTotem();
          }

          if (data.type === "totem_activated") {
            const payload = data.payload || {};

            sessionId = payload.session_id || sessionId;

            activated = true;

            setActive(true);

            setStatus(
              "Como posso ajudar?",
              "Fale ou digite sua pergunta.",
              payload.message || "Olá! Como posso ajudar você hoje?"
            );

            show("btnVoice");
            show("btnFinish");
            show("message");
            show("textActions");

            const audio =
              payload.audio_base64 ||
              payload.payload?.audio_base64;

            if (audio) {
              await playAudio(audio);
            }
          }

          if (data.type === "voice_status") {
            const payload = data.payload || {};
            const status = payload.status;
            const text = payload.text || "";

            const audio =
              payload.payload?.audio_base64 ||
              payload.audio_base64;

            if (status === "listening") {
              setStatus(
                "Escutando...",
                "",
                text || "Estou ouvindo..."
              );
            }

            if (status === "transcribed") {
              setStatus(
                "Pergunta recebida",
                "",
                text
              );
            }

            if (status === "answer_ready") {
              setStatus(
                "Resposta",
                "Você pode fazer outra pergunta.",
                text || "Resposta pronta."
              );

              await playAudio(audio);
            }

            if (
              status === "capture_error" ||
              status === "interaction_error" ||
              status === "empty_transcription"
            ) {
              setStatus(
                "Erro",
                "",
                text || "Falha na interação."
              );
            }
          }

          if (data.type === "presence_cleared") {
            location.reload();
          }

        } catch (e) {
          console.error(e);
        }
      };
    }

    el("btnVoice").onclick = startVoiceQuestion;
    el("btnSendText").onclick = sendTextQuestion;
    el("btnFinish").onclick = finishSession;

    connectSSE();
  </script>
</body>
</html>
