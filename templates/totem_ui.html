<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Totem • AgentAI</title>

  <link rel="stylesheet" href="/static/css/app.css" />

  <style>
    .hidden { display: none !important; }

    .totem-public-body {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .totem-shell {
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: 32px;
    }

    .totem-panel {
      width: min(980px, 100%);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 32px;
      padding: 42px;
      background:
        radial-gradient(circle at top, rgba(39,224,161,.14), transparent 34%),
        linear-gradient(180deg, rgba(24,33,44,.96), rgba(10,15,22,.98));
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .totem-orb {
      width: 92px;
      height: 92px;
      margin: 0 auto 26px;
      border-radius: 999px;
      background: radial-gradient(circle, #27e0a1 0%, #127553 52%, rgba(39,224,161,.08) 72%);
      box-shadow: 0 0 50px rgba(39,224,161,.42);
      opacity: .72;
      transition: .25s ease;
    }

    .totem-orb.active {
      opacity: 1;
      transform: scale(1.06);
      box-shadow: 0 0 72px rgba(39,224,161,.62);
    }

    .totem-title {
      margin: 0;
      text-align: center;
      font-size: clamp(2.2rem, 5vw, 4.8rem);
      letter-spacing: -0.05em;
    }

    .totem-subtitle {
      margin: 14px auto 0;
      text-align: center;
      max-width: 720px;
      font-size: clamp(1.05rem, 2vw, 1.45rem);
    }

    .answer-card {
      margin-top: 34px;
      padding: 28px;
      border-radius: 26px;
      background: rgba(8,12,18,.74);
      border: 1px solid rgba(255,255,255,.08);
    }

    .answer-box {
      min-height: 150px;
      padding: 26px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(4,8,14,.52);
      color: #eef3f8;
      font-size: clamp(1.25rem, 2.1vw, 1.9rem);
      line-height: 1.42;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 20px;
    }

    .text-card,
    .final-card {
      margin-top: 22px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(8,12,18,.72);
      border: 1px solid rgba(255,255,255,.08);
    }

    .qr-image {
      width: 240px;
      max-width: 100%;
      margin: 16px auto;
      display: block;
      background: #fff;
      padding: 12px;
      border-radius: 18px;
    }

    .final-link {
      word-break: break-all;
      font-weight: 800;
      color: var(--accent);
    }

    @media (max-width: 720px) {
      .totem-shell {
        padding: 16px;
      }

      .totem-panel {
        padding: 26px;
        border-radius: 24px;
      }

      .answer-box {
        min-height: 120px;
      }
    }
  </style>
</head>

<body class="totem-public-body">
  <main class="totem-shell">
    <section class="totem-panel">
      <div class="totem-orb" id="orb"></div>

      <h1 class="totem-title" id="title">Aguardando presença...</h1>
      <p class="totem-subtitle muted" id="subtitle">O sistema será ativado automaticamente.</p>

      <div class="answer-card">
        <h2>Atendimento</h2>
        <div id="answer" class="answer-box">Aguardando ativação...</div>

        <div class="actions">
          <button class="btn primary hidden" onclick="startVoiceQuestion()" id="btnAsk">Fazer pergunta</button>
          <button class="btn primary hidden" onclick="startVoiceQuestion()" id="btnAskAgain">Nova pergunta</button>
          <button class="btn hidden" onclick="endSession('completed')" id="btnFinish">Encerrar atendimento</button>
        </div>
      </div>

      <div class="text-card hidden" id="textCard">
        <h2>Pergunta por texto</h2>
        <textarea id="message" rows="3" placeholder="Digite sua pergunta..."></textarea>

        <div class="actions">
          <button class="btn primary" onclick="sendTextQuestion()" id="btnSendText">Enviar texto</button>
          <button class="btn" onclick="clearInput()">Limpar</button>
        </div>
      </div>

      <div class="final-card hidden" id="finalCard">
        <h2>Continue no celular</h2>
        <p id="finalMessage"></p>
        <img id="handoffQr" class="qr-image hidden" alt="QR Code para continuar no celular" />
        <p class="final-link" id="handoffUrl"></p>
        <p class="muted">Depois da leitura do QR Code, o totem reinicia automaticamente.</p>
      </div>
    </section>
  </main>

  <script>
    const companyId = "{{ company_id }}";

    let sessionId = "totem-ui-" + Date.now();
    let currentAudio = null;
    let activated = false;
    let captureInProgress = false;

    function byId(id) {
      return document.getElementById(id);
    }

    function show(id) {
      byId(id).classList.remove("hidden");
    }

    function hide(id) {
      byId(id).classList.add("hidden");
    }

    function setOrb(active) {
      byId("orb").classList.toggle("active", Boolean(active));
    }

    function setStatus(title, subtitle, answer) {
      byId("title").textContent = title;
      byId("subtitle").textContent = subtitle || "";

      if (answer !== undefined) {
        byId("answer").textContent = answer;
      }
    }

    function stopAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
    }

    function showQuestionControls() {
      show("btnAskAgain");
      show("btnFinish");
      show("textCard");
      hide("btnAsk");
    }

    function showInitialControls() {
      show("btnAsk");
      show("btnFinish");
      show("textCard");
      hide("btnAskAgain");
    }

    async function playAudioBase64(audioBase64) {
      stopAudio();

      if (!audioBase64) {
        return false;
      }

      return new Promise((resolve) => {
        try {
          currentAudio = new Audio("data:audio/mp3;base64," + audioBase64);
          currentAudio.playsInline = true;
          currentAudio.onended = () => resolve(true);
          currentAudio.onerror = () => resolve(false);
          currentAudio.play().catch(() => resolve(false));
        } catch (error) {
          resolve(false);
        }
      });
    }

    async function activateTotemFromBackend(payload) {
      if (activated) return;

      activated = true;
      setOrb(true);

      if (payload && payload.session_id) {
        sessionId = payload.session_id;
      }

      hide("finalCard");
      setStatus("Presença detectada", "Ativando atendimento...", "Preparando saudação...");

      try {
        const res = await fetch("/totem/activate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            company_id: companyId,
            session_id: sessionId,
            prefer_audio: true
          })
        });

        const data = await res.json();
        const greeting = data.greeting || "Olá! Como posso ajudar você hoje?";

        setStatus("Como posso ajudar hoje?", "Fale após a saudação ou digite sua pergunta.", greeting);
        showInitialControls();

        await playAudioBase64(data.audio_base64);
        startVoiceQuestion();
      } catch (error) {
        console.error("Erro ao ativar totem:", error);
        setStatus("Como posso ajudar hoje?", "Fale ou digite sua pergunta.", "Olá! Como posso ajudar você hoje?");
        showInitialControls();
      }
    }

    async function startVoiceQuestion() {
      if (captureInProgress) return;

      captureInProgress = true;
      stopAudio();

      hide("btnAsk");
      hide("btnAskAgain");

      setStatus("Estou escutando...", "Fale sua pergunta agora.", "Capturando áudio pelo microfone do totem...");

      try {
        const res = await fetch(`/api/voice/capture?session_id=${encodeURIComponent(sessionId)}`, {
          method: "POST"
        });

        const data = await res.json();

        if (!data.ok) {
          setStatus("Erro", "Não foi possível acionar o microfone.", data.error || "Falha ao capturar áudio.");
          showQuestionControls();
        }
      } catch (error) {
        console.error("Erro ao iniciar captura:", error);
        setStatus("Erro", "Não foi possível acionar o microfone.", "Verifique o Raspberry voice_server.py.");
        showQuestionControls();
      } finally {
        captureInProgress = false;
      }
    }

    async function sendTextQuestion() {
      stopAudio();

      const message = byId("message").value.trim();
      if (!message) return;

      byId("btnSendText").disabled = true;
      setStatus("Processando...", "Gerando resposta.", message);

      try {
        const res = await fetch("/totem/interact", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            company_id: companyId,
            session_id: sessionId,
            message,
            prefer_audio: true
          })
        });

        const data = await res.json();

        setStatus("Resposta", "Você pode fazer nova pergunta ou encerrar.", data.text || "Resposta pronta.");
        byId("message").value = "";

        await playAudioBase64(data.audio_base64);
        showQuestionControls();
      } catch (error) {
        setStatus("Erro", "", "Não foi possível processar sua pergunta.");
        showQuestionControls();
      } finally {
        byId("btnSendText").disabled = false;
      }
    }

    async function endSession(reason) {
      stopAudio();

      const res = await fetch("/totem/end", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          company_id: companyId,
          session_id: sessionId,
          reason
        })
      });

      const data = await res.json();

      hide("btnAsk");
      hide("btnAskAgain");
      hide("btnFinish");
      hide("textCard");
      show("finalCard");

      setStatus("Atendimento finalizado", "Leia o QR Code para continuar no celular.", data.summary || data.message || "Atendimento finalizado.");
      byId("finalMessage").textContent = data.message || "";

      if (data.handoff_qr_url) {
        byId("handoffQr").src = data.handoff_qr_url;
        show("handoffQr");
      }

      byId("handoffUrl").textContent = data.handoff_url || "";

      setTimeout(() => {
        resetScreen(false);
      }, 10000);
    }

    function clearInput() {
      byId("message").value = "";
    }

    function resetScreen(reloadPage) {
      activated = false;
      sessionId = "totem-ui-" + Date.now();
      captureInProgress = false;

      stopAudio();
      setOrb(false);

      hide("btnAsk");
      hide("btnAskAgain");
      hide("btnFinish");
      hide("textCard");
      hide("finalCard");

      setStatus("Aguardando presença...", "O sistema será ativado automaticamente.", "Aguardando ativação...");

      if (reloadPage) {
        window.location.reload();
      }
    }

    function connectSSE() {
      const eventSource = new EventSource(`/api/events/${companyId}`);

      eventSource.onmessage = function(event) {
        try {
          const data = JSON.parse(event.data);
          console.log("SSE:", data);

          if (
            data.type === "presence_detected" ||
            data.type === "presence_triggered" ||
            data.type === "totem_activated"
          ) {
            activateTotemFromBackend(data.payload || {});
          }

          if (data.type === "voice_status") {
            const payload = data.payload || {};
            const status = payload.status;
            const text = payload.text || "";
            const audio = payload.payload?.audio_base64 || payload.audio_base64;

            if (status === "answer_ready") {
              setStatus("Resposta", "Você pode fazer nova pergunta ou encerrar.", text || "Resposta pronta.");

              playAudioBase64(audio).then(() => {
                showQuestionControls();
              });
            }

            if (status === "error") {
              setStatus("Erro", "", text || "Não consegui processar a pergunta.");
              showQuestionControls();
            }
          }

          if (data.type === "presence_cleared") {
            resetScreen(true);
          }
        } catch (error) {
          console.error("Erro SSE:", error);
        }
      };

      eventSource.onerror = function(error) {
        console.warn("Erro SSE:", error);
      };
    }

    resetScreen(false);
    connectSSE();
  </script>
</body>
</html>
