<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>TOTEM IA.GORA</title>

  <link rel="stylesheet" href="/static/css/app.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #071018;
      color: #eef3f8;
      font-family: Inter, sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
    }

    .panel {
      width: min(980px, 100%);
      border-radius: 28px;
      padding: 42px;
      background:
        radial-gradient(circle at top, rgba(39,224,161,.14), transparent 34%),
        linear-gradient(180deg, rgba(24,33,44,.96), rgba(10,15,22,.98));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 24px 80px rgba(0,0,0,.42);
    }

    .orb {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 999px;
      background:
        radial-gradient(circle,
        #27e0a1 0%,
        #127553 52%,
        rgba(39,224,161,.08) 72%);
      box-shadow: 0 0 64px rgba(39,224,161,.45);
      opacity: .5;
      transition: .25s ease;
    }

    .orb.active {
      opacity: 1;
      transform: scale(1.06);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(2rem, 5vw, 4rem);
    }

    .subtitle {
      text-align: center;
      opacity: .8;
      margin-top: 12px;
      font-size: 1.2rem;
    }

    .answer {
      margin-top: 32px;
      padding: 26px;
      border-radius: 22px;
      background: rgba(4,8,14,.52);
      border: 1px solid rgba(255,255,255,.08);
      min-height: 120px;
      font-size: 1.4rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    textarea {
      width: 100%;
      margin-top: 24px;
      min-height: 110px;
      border-radius: 18px;
      padding: 18px;
      background: rgba(0,0,0,.28);
      color: white;
      border: 1px solid rgba(255,255,255,.08);
      resize: vertical;
      font-size: 1rem;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 14px 20px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .primary {
      background: #27e0a1;
      color: #04130d;
    }

    .secondary {
      background: rgba(255,255,255,.12);
      color: #eef3f8;
      border: 1px solid rgba(255,255,255,.12);
    }

    .hidden {
      display: none !important;
    }

    .qr {
      width: 220px;
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin: 24px auto 0;
      display: block;
    }

    .link {
      word-break: break-all;
      text-align: center;
      margin-top: 14px;
      font-weight: 700;
      color: #27e0a1;
    }

    .debug {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      color: rgba(238,243,248,.72);
      font-size: .85rem;
      line-height: 1.45;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="panel">

      <div class="orb" id="orb"></div>

      <h1 id="title">Aguardando presença...</h1>

      <p class="subtitle" id="subtitle">
        Ative o áudio uma vez para permitir fala automática.
      </p>

      <div class="answer" id="answer">
        Clique em “Ativar áudio” e aproxime-se do totem.
      </div>

      <div class="actions">
        <button class="primary" id="btnAudio">
          Ativar áudio
        </button>

        <button class="primary hidden" id="btnVoice">
          Fazer pergunta
        </button>

        <button class="hidden" id="btnFinish">
          Encerrar atendimento
        </button>
      </div>

      <textarea
        id="message"
        class="hidden"
        placeholder="Digite sua pergunta..."
      ></textarea>

      <div class="actions hidden" id="textActions">
        <button class="primary" id="btnSendText">
          Enviar texto
        </button>
      </div>

      <div id="finalBlock" class="hidden">
        <img id="qr" class="qr hidden"/>
        <div id="handoff" class="link"></div>
      </div>

      <div class="debug" id="debug">
        SSE: inicializando
      </div>

    </section>
  </main>

  <script>
    const companyId = "{{ company_id }}";

    const AUTO_LISTEN_AFTER_GREETING = true;
    const PLAY_AUDIO_ON_INTERACTION_COMPLETED = false;

    let sessionId = null;
    let currentAudio = null;
    let sse = null;
    let reconnectTimer = null;
    let voiceBusy = false;
    let audioUnlocked = false;
    let audioContext = null;
    let autoListenScheduled = false;

    const greetedSessions = new Set();
    const playedAudioKeys = new Set();

    function el(id) {
      return document.getElementById(id);
    }

    function show(id) {
      el(id).classList.remove("hidden");
    }

    function hide(id) {
      el(id).classList.add("hidden");
    }

    function debug(message) {
      el("debug").textContent = message;
      console.log("[TOTEM_UI]", message);
    }

    function setStatus(title, subtitle, answer) {
      el("title").textContent = title;
      el("subtitle").textContent = subtitle || "";
      el("answer").textContent = answer || "";
    }

    function setActive(active) {
      el("orb").classList.toggle("active", !!active);
    }

    function setVoiceBusy(active) {
      voiceBusy = !!active;
      el("btnVoice").disabled = voiceBusy;
      el("btnSendText").disabled = voiceBusy;
    }

    function stopAudio() {
      if (!currentAudio) return;

      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    async function unlockAudio() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
          audioContext = audioContext || new AudioContextClass();

          if (audioContext.state === "suspended") {
            await audioContext.resume();
          }
        }

        const testAudio = new Audio(
          "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA="
        );

        testAudio.muted = true;
        await testAudio.play().catch(() => {});

        audioUnlocked = true;
        hide("btnAudio");

        debug("Áudio desbloqueado | SSE pronto | aguardando presença");

        if (!sessionId) {
          setStatus(
            "Aguardando presença...",
            "Áudio ativado. O sistema será iniciado automaticamente.",
            "Aguardando ativação..."
          );
        }

        return true;
      } catch (e) {
        audioUnlocked = false;
        debug("Falha ao desbloquear áudio: " + e.message);

        setStatus(
          "Áudio bloqueado",
          "Clique em Ativar áudio novamente.",
          "O navegador bloqueou a reprodução automática."
        );

        return false;
      }
    }

   async function playAudio(audioBase64, key) {
  stopAudio();

  if (!audioBase64) {
    debug("Audio ausente");
    return false;
  }

  const audioKey = key || String(audioBase64.length);

  if (playedAudioKeys.has(audioKey)) {
    debug("Áudio ignorado por duplicidade: " + audioKey);
    return false;
  }

  playedAudioKeys.add(audioKey);

  return new Promise((resolve) => {
    try {
      function tryPlay(mimeType) {
        currentAudio = new Audio(
          `data:${mimeType};base64,${audioBase64}`
        );

        currentAudio.onended = () => {
          debug("Áudio finalizado: " + audioKey);
          resolve(true);
        };

        currentAudio.onerror = async () => {
          debug("Falha ao reproduzir como " + mimeType);

          if (mimeType === "audio/mp3") {
            try {
              tryPlay("audio/wav");
              return;
            } catch (_) {}
          }

          playedAudioKeys.delete(audioKey);
          resolve(false);
        };

        const playPromise = currentAudio.play();

        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch((error) => {
            debug("Audio.play bloqueado: " + error.message);

            playedAudioKeys.delete(audioKey);

            show("btnAudio");

            setStatus(
              "Áudio bloqueado",
              "Clique em Ativar áudio para continuar.",
              "O navegador bloqueou a reprodução automática."
            );

            resolve(false);
          });
        }
      }

      tryPlay("audio/mp3");

    } catch (e) {
      playedAudioKeys.delete(audioKey);
      debug("Falha ao preparar áudio: " + e.message);
      resolve(false);
    }
  });
}

    function enableInteraction() {
      show("btnVoice");
      show("btnFinish");
      show("message");
      show("textActions");
    }

    function disableInteraction() {
      hide("btnVoice");
      hide("btnFinish");
      hide("message");
      hide("textActions");
      setVoiceBusy(false);
    }

    async function startVoiceQuestion() {
      if (voiceBusy) return false;

      if (!sessionId) {
        setStatus(
          "Aguardando sessão",
          "",
          "Aproxime-se do totem para iniciar o atendimento."
        );
        return false;
      }

      setVoiceBusy(true);

      setStatus(
        "Escutando...",
        "Fale sua pergunta agora.",
        "Capturando áudio..."
      );

      debug("Solicitando captura de voz | session_id=" + sessionId);

      try {
        const response = await fetch(
          `/api/voice/capture?session_id=${encodeURIComponent(sessionId)}`,
          { method: "POST" }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok || data.ok === false) {
          setVoiceBusy(false);

          setStatus(
            "Erro de voz",
            "Tente novamente.",
            data.error || "Falha ao acionar o Raspberry."
          );

          debug("Falha /api/voice/capture: " + JSON.stringify(data));
          return false;
        }

        debug("Captura acionada no Raspberry | mode=" + (data.mode || "unknown"));
        return true;
      } catch (e) {
        console.error(e);
        setVoiceBusy(false);
        setStatus("Erro", "Tente novamente.", "Falha ao capturar áudio.");
        debug("Erro fetch /api/voice/capture: " + e.message);
        return false;
      }
    }

    async function sendTextQuestion() {
      if (voiceBusy) return;

      if (!sessionId) {
        setStatus(
          "Aguardando sessão",
          "",
          "Aproxime-se do totem para iniciar o atendimento."
        );
        return;
      }

      const message = el("message").value.trim();

      if (!message) return;

      setVoiceBusy(true);
      setStatus("Processando...", "", message);

      try {
        const response = await fetch("/totem/interact", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            company_id: companyId,
            session_id: sessionId,
            message,
            prefer_audio: true
          })
        });

        const data = await response.json();

        setStatus(
          "Resposta",
          "Você pode fazer outra pergunta.",
          data.text || "Resposta pronta."
        );

        el("message").value = "";

        await playAudio(
          data.audio_base64,
          `text:${sessionId}:${data.text || ""}:${(data.audio_base64 || "").length}`
        );
      } catch (e) {
        console.error(e);
        setStatus("Erro", "", "Falha ao processar pergunta.");
        debug("Erro /totem/interact texto: " + e.message);
      } finally {
        setVoiceBusy(false);
      }
    }

    async function finishSession() {
      if (!sessionId) return;

      const response = await fetch("/totem/end", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          company_id: companyId,
          session_id: sessionId,
          reason: "completed"
        })
      });

      const data = await response.json();

      setStatus(
        "Atendimento finalizado",
        "Continue no celular.",
        data.message || "Escaneie o QR Code."
      );

      if (data.handoff_qr_url) {
        el("qr").src = data.handoff_qr_url;
        show("qr");
      }

      el("handoff").textContent = data.handoff_url || "";

      show("finalBlock");
      disableInteraction();
      setActive(false);
    }

    async function maybeStartAutoListen() {
      if (!AUTO_LISTEN_AFTER_GREETING) return;
      if (!audioUnlocked) return;
      if (!sessionId) return;
      if (voiceBusy) return;
      if (autoListenScheduled) return;

      autoListenScheduled = true;

      setTimeout(async () => {
        autoListenScheduled = false;

        if (!sessionId || voiceBusy) return;

        await startVoiceQuestion();
      }, 500);
    }

    async function handleTotemActivated(payload) {
      const incomingSessionId = payload.session_id || sessionId;

      if (!incomingSessionId) return;

      sessionId = incomingSessionId;

      setActive(true);
      setVoiceBusy(false);
      enableInteraction();

      setStatus(
        "Como posso ajudar?",
        audioUnlocked
          ? "Vou iniciar a escuta após a saudação."
          : "Clique em Ativar áudio para ouvir e iniciar a escuta.",
        payload.message || "Olá! Como posso ajudar você hoje?"
      );

      debug("totem_activated | session_id=" + sessionId);

      if (greetedSessions.has(sessionId)) {
        await maybeStartAutoListen();
        return;
      }

      greetedSessions.add(sessionId);

      if (!audioUnlocked) {
        show("btnAudio");
        debug("Greeting aguardando desbloqueio de áudio");
        return;
      }

      await playAudio(
        payload.audio_base64,
        `greeting:${sessionId}:${(payload.audio_base64 || "").length}`
      );

      await maybeStartAutoListen();
    }

    async function handleInteractionCompleted(payload) {
      if (payload.session_id && payload.session_id !== sessionId) return;

      setVoiceBusy(false);

      setStatus(
        "Resposta",
        "Você pode fazer outra pergunta.",
        payload.response || payload.text || "Resposta pronta."
      );

      debug("interaction_completed | session_id=" + sessionId);

      if (!PLAY_AUDIO_ON_INTERACTION_COMPLETED) return;

      await playAudio(
        payload.audio_base64,
        `interaction:${sessionId}:${payload.response || payload.text || ""}:${(payload.audio_base64 || "").length}`
      );
    }

    function handlePresenceDetected(payload) {
      if (payload.session_id) {
        sessionId = payload.session_id;
      }

      setActive(true);
      debug("presence_detected | session_id=" + (sessionId || "null"));

      if (!sessionId) {
        setStatus(
          "Presença detectada",
          "Validando atendimento...",
          "Preparando saudação."
        );
      }
    }

    function handlePresenceCleared(payload) {
      if (payload.session_id && sessionId && payload.session_id !== sessionId) {
        return;
      }

      sessionId = null;
      autoListenScheduled = false;

      stopAudio();
      disableInteraction();
      hide("finalBlock");
      hide("qr");
      setActive(false);

      setStatus(
        "Aguardando presença...",
        audioUnlocked
          ? "Áudio ativo. O sistema será ativado automaticamente."
          : "Ative o áudio uma vez para permitir fala automática.",
        audioUnlocked
          ? "Aguardando ativação..."
          : "Clique em “Ativar áudio” e aproxime-se do totem."
      );

      debug("presence_cleared");
    }

    async function handleVoiceStatus(payload) {
      if (!payload) return;
      if (payload.session_id && sessionId && payload.session_id !== sessionId) return;

      const status = payload.status;
      const nested = payload.payload || {};

      debug(`voice_status | ${status} | session_id=${payload.session_id || "null"}`);

      if (status === "listening" || status === "recording") {
        setVoiceBusy(true);
        setStatus(
          "Escutando...",
          "Fale sua pergunta agora.",
          payload.text || "Capturando áudio..."
        );
        return;
      }

      if (status === "transcribed") {
        setVoiceBusy(true);
        setStatus(
          "Transcrição recebida",
          "Processando resposta...",
          payload.text || "Processando pergunta."
        );
        return;
      }

      if (status === "answer_ready") {
        setVoiceBusy(false);

        const answer = payload.text || "Resposta pronta.";
        const audioBase64 = nested.audio_base64 || payload.audio_base64 || "";

        setStatus(
          "Resposta",
          "Você pode fazer outra pergunta.",
          answer
        );

        await playAudio(
          audioBase64,
          `answer:${payload.session_id || sessionId}:${answer}:${audioBase64.length}`
        );

        return;
      }

      if (status === "capture_error") {
        setVoiceBusy(false);
        setStatus(
          "Erro de captura",
          "Verifique o microfone do Raspberry.",
          payload.text || "Não consegui capturar o áudio."
        );
        return;
      }

      if (status === "silence") {
        setVoiceBusy(false);
        setStatus(
          "Não ouvi sua pergunta",
          "Fale mais perto do microfone e tente novamente.",
          payload.text || "Áudio abaixo do volume mínimo."
        );
        return;
      }

      if (status === "empty_transcription") {
        setVoiceBusy(false);
        setStatus(
          "Não entendi a pergunta",
          "Fale mais perto do microfone e tente novamente.",
          payload.text || "A transcrição veio vazia."
        );
        return;
      }

      if (status === "interaction_error") {
        setVoiceBusy(false);
        setStatus(
          "Erro ao responder",
          "Tente novamente.",
          payload.text || "Não consegui processar sua pergunta agora."
        );
        return;
      }

      if (status === "error") {
        setVoiceBusy(false);
        setStatus(
          "Erro de voz",
          "Tente novamente.",
          payload.text || "Falha no fluxo de voz."
        );
      }
    }

    function handleSSEMessage(event) {
      try {
        const data = JSON.parse(event.data);
        console.log("SSE COMPLETO:", data);
        const payload = data.payload || {};

        if (data.type === "keepalive") {
          return;
        }

        debug("SSE recebido: " + data.type);

        if (data.type === "presence_detected") {
          handlePresenceDetected(payload);
          return;
        }

        if (data.type === "presence_cleared") {
          handlePresenceCleared(payload);
          return;
        }

        if (data.type === "totem_activated") {
          handleTotemActivated(payload);
          return;
        }

        if (data.type === "interaction_completed") {
          handleInteractionCompleted(payload);
          return;
        }

        if (data.type === "voice_status") {
          handleVoiceStatus(payload);
          return;
        }

        if (data.type === "session_ended") {
          setActive(false);
          setVoiceBusy(false);
          debug("session_ended | session_id=" + (payload.session_id || "null"));
        }

      } catch (e) {
        console.error(e);
        debug("Erro ao processar SSE: " + e.message);
      }
    }

    function connectSSE() {
      if (sse) {
        sse.close();
      }

      sse = new EventSource(`/api/events/${companyId}`);
      sse.onmessage = handleSSEMessage;

      sse.onopen = () => {
        debug("SSE conectado | company_id=" + companyId);
      };

      sse.onerror = () => {
        debug("SSE desconectado. Reconectando...");

        if (sse) {
          sse.close();
          sse = null;
        }

        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectSSE, 2000);
      };
    }

    el("btnAudio").addEventListener("click", async () => {
      const ok = await unlockAudio();

      if (ok && sessionId && greetedSessions.has(sessionId)) {
        await maybeStartAutoListen();
      }
    });

    el("btnVoice").addEventListener("click", async () => {
      if (!audioUnlocked) {
        await unlockAudio();
      }

      await startVoiceQuestion();
    });

    el("btnSendText").addEventListener("click", sendTextQuestion);
    el("btnFinish").addEventListener("click", finishSession);

    connectSSE();
  </script>
</body>
</html>
