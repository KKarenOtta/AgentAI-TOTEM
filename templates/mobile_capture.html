<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro mobile</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <style>
    body {
      margin: 0;
      background: #0b0f14;
      color: #eef3f8;
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: linear-gradient(180deg, rgba(24,33,44,.92), rgba(18,24,33,.96));
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 20px;
      padding: 18px;
    }

    .form {
      display: grid;
      gap: 12px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.08);
      background: #0e141c;
      color: #eef3f8;
      outline: none;
      box-sizing: border-box;
    }

    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 8px;
      color: #d7e3ef;
      line-height: 1.5;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #27e0a1, #19b987);
      color: #07110d;
    }

    .muted {
      color: #9fb0c3;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <h1>Cadastro para liberar ofertas</h1>

      {% if handoff %}
        <p class="muted">
          Preencha seus dados para liberar cupons, receber o resumo da pesquisa e validar campanhas.
        </p>

        <form class="form" method="post" action="/mobile/capture/{{ session_id }}">
          <input type="text" name="full_name" placeholder="Nome completo" required minlength="3" />
          <input type="number" name="age" placeholder="Idade" required min="0" max="120" />

          <select name="gender" required>
            <option value="">Selecione o gênero</option>
            <option value="female">Feminino</option>
            <option value="male">Masculino</option>
            <option value="nonbinary">Não binário</option>
            <option value="unknown">Prefiro não informar</option>
          </select>

          <input type="email" name="email" placeholder="E-mail" required />
          <input type="text" name="cpf" placeholder="CPF (obrigatório)" required />
          <input type="text" name="favorite_brands" placeholder="Marcas favoritas (opcional, separadas por vírgula)" />

          <label class="checkbox-row">
            <input type="checkbox" name="lgpd_consent" value="true" required />
            <span>Li e aceito o tratamento dos meus dados para acesso às ofertas, newsletter e recuperação resumida do atendimento, em conformidade com a LGPD.</span>
          </label>

          <button class="btn" type="submit">Liberar acesso</button>
        </form>
      {% else %}
        <p class="muted">
          Não foi possível localizar a sessão do totem. Volte ao totem e gere um novo QR code.
        </p>
      {% endif %}
    </section>
  </main>
</body>
</html>
