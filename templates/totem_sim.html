{% extends "base.html" %}
{% block content %}
<section class="page-header">
  <div>
    <span class="badge">Simulador</span>
    <h1 class="page-title">Simulador do Totem • {{ company_id }}</h1>
    <p class="page-subtitle">Teste o backend com perfil manual antes de rodar no Raspberry Pi 3.</p>
  </div>
</section>

<div class="grid">
  <div class="card">
    <h2>Perfil do visitante</h2>
    <div class="form">
      <div class="row">
        <select id="age">
          <option value="">Selecione faixa etária</option>
          <option>18-24</option>
          <option>25-34</option>
          <option>35-44</option>
          <option>45-54</option>
          <option>55-64</option>
          <option>65+</option>
        </select>

        <select id="segment">
          <option value="new_visitor">new_visitor</option>
          <option value="returning">returning</option>
          <option value="vip">vip</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Interação</h2>
    <div class="form">
      <textarea id="msg" rows="4" placeholder="Digite a mensagem...">Quais promoções estão ativas para mim hoje?</textarea>
      <div class="actions">
        <button id="sendBtn" type="button" class="btn primary" onclick="send()">Enviar</button>
      </div>
    </div>
  </div>
</div>

<div class="card" style="margin-top:20px;">
  <h2>Resposta</h2>
  <pre id="out">—</pre>
</div>

<script>
let busy = false;

async function send(){
  if (busy) return;

  busy = true;
  const btn = document.getElementById("sendBtn");
  btn.disabled = true;

  try {
    const payload = {
      company_id: "{{ company_id }}",
      session_id: "sim-web",
      message: document.querySelector("#msg").value,
      prefer_audio: false,
      profile: {
        age_range: document.querySelector("#age").value || null,
        gender: "unknown",
        segment: document.querySelector("#segment").value,
        device: "sim_web",
        locale: "pt-BR",
        extra: {
          source: "simulator"
        }
      }
    };

    const r = await fetch("/totem/interact", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });

    const data = await r.json();
    document.querySelector("#out").textContent = JSON.stringify(data, null, 2);

  } catch(e) {
    document.querySelector("#out").textContent = `Erro: ${e}`;
    console.error(e);
  } finally {
    busy = false;
    btn.disabled = false;
  }
}
</script>
{% endblock %}
