{% extends "base.html" %}
{% block content %}

<section class="page-header">
  <div>
    <span class="badge">Campanhas</span>
    <h1 class="page-title">Campanhas • {{ company_id }}</h1>
    <p class="page-subtitle">Crie, edite e remova campanhas exibidas no totem.</p>
  </div>
</section>

<div class="grid">
  <div class="card">
    <h2>Cadastro / edição</h2>

    <div class="form">
      <input id="campaignId" type="hidden" />

      <label>Nome</label>
      <input id="name" placeholder="Ex: Loja do Pinguim" />

      <label>Descrição</label>
      <textarea id="description" rows="4" placeholder="Descrição curta da campanha"></textarea>

      <div class="row">
        <div>
          <label>Status</label>
          <select id="status">
            <option value="active">active</option>
            <option value="inactive">inactive</option>
          </select>
        </div>

        <div>
          <label>Prioridade</label>
          <select id="priority">
            <option value="normal">normal</option>
            <option value="high">high</option>
            <option value="low">low</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label>CTA</label>
          <input id="ctaLabel" placeholder="Quero saber mais" />
        </div>

        <div>
          <label>Cupom</label>
          <input id="couponCode" placeholder="ZOO10" />
        </div>
      </div>

      <div class="row">
        <div>
          <label>Desconto (%)</label>
          <input id="discountValue" type="number" value="0" />
        </div>

        <div>
          <label>Landing URL</label>
          <input id="landingUrl" placeholder="https://zoologico.com.br/" />
        </div>
      </div>

      <label>Intents alvo separados por vírgula</label>
      <input id="targetIntents" placeholder="compra,loja,presente" />

      <div class="actions">
        <button class="btn primary" onclick="saveCampaign()">Salvar</button>
        <button class="btn" onclick="clearForm()">Limpar</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Resumo</h2>
    <div class="stat">
      <div class="stat-label">Campanhas carregadas</div>
      <div class="stat-value" id="totalCampaigns">—</div>
    </div>
  </div>
</div>

<div class="card" style="margin-top:20px;">
  <h2>Campanhas cadastradas</h2>
  <div id="campaignList" class="card-grid"></div>
</div>

<script>
const companyId = "{{ company_id }}";
let campaigns = [];

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function loadCampaigns() {
  const res = await fetch(`/api/campaigns/${companyId}`);
  const data = await res.json();

  campaigns = data.campaigns || [];
  document.getElementById("totalCampaigns").textContent = campaigns.length;

  renderCampaigns();
}

function renderCampaigns() {
  const el = document.getElementById("campaignList");

  if (!campaigns.length) {
    el.innerHTML = `<div class="empty-state">Nenhuma campanha cadastrada.</div>`;
    return;
  }

  el.innerHTML = campaigns.map((c, index) => `
    <article class="mini-card">
      ${c.media_image ? `<img src="${escapeHtml(c.media_image)}" class="campaign-thumb" />` : ""}
      <div class="mini-card-title">${escapeHtml(c.name || c.title || "Campanha")}</div>
      <div class="mini-card-subtitle">${escapeHtml(c.campaign_id || c.id || "sem-id")}</div>
      <p>${escapeHtml(c.description || "Sem descrição.")}</p>

      <div class="stack-list compact">
        <div class="metric-row">
          <div class="metric-row-label">Status</div>
          <div class="metric-row-value">${escapeHtml(c.status || "—")}</div>
        </div>
        <div class="metric-row">
          <div class="metric-row-label">Cupom</div>
          <div class="metric-row-value">${escapeHtml(c.coupon_code || "—")}</div>
        </div>
      </div>

      <div class="actions" style="margin-top:10px;">
        <button class="btn" onclick="editCampaign(${index})">Editar</button>
        <button class="btn danger" onclick="deleteCampaign(${index})">Excluir</button>
      </div>
    </article>
  `).join("");
}

function getCampaignId(c) {
  return c.campaign_id || c.id;
}

function clearForm() {
  document.getElementById("campaignId").value = "";
  document.getElementById("name").value = "";
  document.getElementById("description").value = "";
  document.getElementById("status").value = "active";
  document.getElementById("priority").value = "normal";
  document.getElementById("ctaLabel").value = "";
  document.getElementById("couponCode").value = "";
  document.getElementById("discountValue").value = 0;
  document.getElementById("landingUrl").value = "";
  document.getElementById("targetIntents").value = "";
}

function editCampaign(index) {
  const c = campaigns[index];

  document.getElementById("campaignId").value = getCampaignId(c) || "";
  document.getElementById("name").value = c.name || c.title || "";
  document.getElementById("description").value = c.description || "";
  document.getElementById("status").value = c.status || "active";
  document.getElementById("priority").value = c.priority || "normal";
  document.getElementById("ctaLabel").value = c.cta_label || "";
  document.getElementById("couponCode").value = c.coupon_code || "";
  document.getElementById("discountValue").value = c.discount_value || 0;
  document.getElementById("landingUrl").value = c.landing_url || "";
  document.getElementById("targetIntents").value = Array.isArray(c.target_intents) ? c.target_intents.join(",") : "";
}

function payloadFromForm() {
  return {
    name: document.getElementById("name").value.trim(),
    title: document.getElementById("name").value.trim(),
    description: document.getElementById("description").value.trim(),
    status: document.getElementById("status").value,
    priority: document.getElementById("priority").value,
    cta_label: document.getElementById("ctaLabel").value.trim() || "Quero saber mais",
    coupon_code: document.getElementById("couponCode").value.trim(),
    discount_type: "percent",
    discount_value: Number(document.getElementById("discountValue").value || 0),
    landing_url: document.getElementById("landingUrl").value.trim(),
    channel: "totem",
    objective: "conversion",
    qr_mode: "coupon",
    target_intents: document.getElementById("targetIntents").value
      .split(",")
      .map(v => v.trim())
      .filter(Boolean)
  };
}

async function saveCampaign() {
  const id = document.getElementById("campaignId").value;
  const payload = payloadFromForm();

  if (!payload.name) {
    alert("Informe o nome da campanha.");
    return;
  }

  const url = id
    ? `/api/campaigns/${companyId}/${id}`
    : `/api/campaigns/${companyId}`;

  const method = id ? "PATCH" : "POST";

  const res = await fetch(url, {
    method,
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    alert("Erro ao salvar campanha.");
    return;
  }

  clearForm();
  await loadCampaigns();
}

async function deleteCampaign(index) {
  const c = campaigns[index];
  const id = getCampaignId(c);

  if (!id) {
    alert("Campanha sem ID.");
    return;
  }

  if (!confirm(`Excluir campanha ${c.name || id}?`)) return;

  const res = await fetch(`/api/campaigns/${companyId}/${id}`, {
    method: "DELETE"
  });

  if (!res.ok) {
    alert("Erro ao excluir campanha.");
    return;
  }

  await loadCampaigns();
}

loadCampaigns();
</script>

{% endblock %}
