<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Cupom da campanha</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <main class="container">
    <section class="card" style="text-align:center;max-width:640px;margin:40px auto;">
      {% if coupon %}
        <h1>{{ coupon.title }}</h1>

        {% if coupon.media_image %}
          <img src="{{ coupon.media_image }}" class="campaign-thumb" style="margin:20px auto;max-width:320px;" />
        {% endif %}

        <p><strong>{{ coupon.code or "Cupom digital" }}</strong></p>

        {% if coupon.qr_url %}
          <img src="{{ coupon.qr_url }}" class="qr-image" style="margin-top:20px;" />
        {% endif %}
      {% else %}
        <h1>Cupom não encontrado</h1>
      {% endif %}
    </section>
  </main>
</body>
</html>
