<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>-- IA.GORA TOTEM INTERATIVO --</title>
  <link rel="stylesheet" href="/beta-static/style.css?v=52">
</head>
<body>
  <main class="page">
    <section id="screen" class="screen espera">
      <a href="{{ url_for('login') }}" class="brand" aria-label="Acessar area administrativa">FLEXMEDIA TOTEM</a>

      <div class="center-stage">
        <div class="pulse-wrap" aria-hidden="true">
          <span class="pulse-ring ring-1"></span>
          <span class="pulse-ring ring-2"></span>
          <span class="pulse-ring ring-3"></span>
          <span class="pulse-core"></span>
        </div>

        <p id="transcript" class="subtitle" hidden></p>
        <p id="message" class="message"></p>

        <div id="ia-panel" class="ia-panel" hidden>
          <p id="answer" class="subtitle" hidden></p>

          <audio
            id="remote-audio"
            controls
            preload="auto"
            style="margin-top: 16px; width: 100%; max-width: 420px;"
            hidden
          ></audio>

          <div id="input-panel" style="margin-top: 16px; width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 10px;">
            <input
              id="text-input"
              type="text"
              placeholder="Digite uma mensagem"
              style="padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: white; outline: none;"
            />

            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <button
                id="send-text"
                type="button"
                class="admin-button admin-button-gold"
                style="min-height: 48px; flex: 1 1 120px;"
              >
                Enviar
              </button>

              <button
                id="record-btn"
                type="button"
                class="admin-button admin-button-dark"
                style="min-height: 48px; flex: 1 1 120px;"
              >
                Gravar Audio
              </button>

              <button
                id="stop-btn"
                type="button"
                disabled
                class="admin-button admin-button-outline"
                style="min-height: 48px; flex: 1 1 120px; opacity: 0.6;"
              >
                Parar
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="status-panel">
        <div class="status-card"><span class="label">Temperatura</span><strong id="temp">-- C</strong></div>
        <div class="status-card"><span class="label">Umidade</span><strong id="hum">-- %</strong></div>
        <div class="status-card"><span class="label">Sensor 1</span><strong id="dist1">-- cm</strong></div>
        <div class="status-card"><span class="label">Sensor 2</span><strong id="dist2">-- cm</strong></div>
        <div class="status-card"><span class="label">Sensor 3</span><strong id="dist3">-- cm</strong></div>
        <div class="status-card"><span class="label">LED</span><strong id="led">ESPERA</strong></div>
      </div>
    </section>
  </main>

  <script src="/beta-static/app.js?v=52"></script>
</body>
</html>
