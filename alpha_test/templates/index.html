<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Totem Inteligente</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=5">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <h1>Totem Inteligente</h1>
      <p>Monitoramento público do sistema</p>
      <a class="btn-secundario" href="{{ url_for('login') }}">Área administrativa</a>
    </div>
  </header>

  <main class="container">
    <section class="cards-principais">
      <article class="card indicador">
        <span class="rotulo">Temperatura</span>
        <strong class="valor" id="temp">-- °C</strong>
      </article>

      <article class="card indicador">
        <span class="rotulo">Umidade</span>
        <strong class="valor" id="hum">-- %</strong>
      </article>

      <article class="card indicador">
        <span class="rotulo">LED</span>
        <strong class="valor" id="led">Desligado</strong>
      </article>

      <article class="card indicador destaque">
        <span class="rotulo">Estado</span>
        <strong class="valor" id="msg">Inicializando</strong>
      </article>
    </section>

    <section class="bloco">
      <div class="bloco-topo">
        <h2>Sensores ultrassônicos</h2>
        <p>O sensor que detectar aproximação ficará verde.</p>
      </div>

      <div class="sensor-buttons">
        <button class="sensor-btn" id="sensor-esquerda" disabled>Sensor Esquerda</button>
        <button class="sensor-btn" id="sensor-centro" disabled>Sensor Centro</button>
        <button class="sensor-btn" id="sensor-direita" disabled>Sensor Direita</button>
      </div>
    </section>
  </main>

  <script>
    const tempEl = document.getElementById("temp");
    const humEl = document.getElementById("hum");
    const ledEl = document.getElementById("led");
    const msgEl = document.getElementById("msg");

    const sensorMap = {
      "Esquerda": document.getElementById("sensor-esquerda"),
      "Centro": document.getElementById("sensor-centro"),
      "Direita": document.getElementById("sensor-direita")
    };

    function resetSensors() {
      Object.values(sensorMap).forEach(btn => btn.classList.remove("ativo"));
    }

    function formatValue(value, suffix) {
      if (value === null || value === undefined) return `-- ${suffix}`;
      return `${value} ${suffix}`;
    }

    async function carregarStatus() {
      try {
        const resposta = await fetch("/api/status");
        const data = await resposta.json();

        tempEl.textContent = formatValue(data.temperature, "°C");
        humEl.textContent = formatValue(data.humidity, "%");
        ledEl.textContent = data.led ? "Ligado" : "Desligado";
        msgEl.textContent = data.message || "Sem status";

        resetSensors();

        if (data.active_sensor && sensorMap[data.active_sensor]) {
          sensorMap[data.active_sensor].classList.add("ativo");
        }
      } catch (erro) {
        msgEl.textContent = "Falha na atualização";
      }
    }

    carregarStatus();
    setInterval(carregarStatus, 1000);
  </script>
</body>
</html>
