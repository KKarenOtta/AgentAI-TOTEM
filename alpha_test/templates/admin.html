<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Totem</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=6">
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <h1>Painel Administrativo</h1>
      <div class="admin-actions">
        <a class="btn-secundario" href="{{ url_for('index') }}">Tela pública</a>
        <a class="btn-secundario" href="{{ url_for('logout') }}">Sair</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="cards-principais">
      <article class="card indicador">
        <span class="rotulo">Temperatura</span>
        <strong class="valor" id="admin-temp">-- °C</strong>
      </article>

      <article class="card indicador">
        <span class="rotulo">Umidade</span>
        <strong class="valor" id="admin-hum">-- %</strong>
      </article>

      <article class="card indicador">
        <span class="rotulo">LED</span>
        <strong class="valor" id="admin-led-status">Desligado</strong>
      </article>

      <article class="card indicador destaque">
        <span class="rotulo">Estado</span>
        <strong class="valor" id="admin-msg">Inicializando</strong>
      </article>
    </section>

    <section class="bloco">
      <div class="bloco-topo">
        <h2>Controle manual do LED</h2>
        <p>Ao ligar manualmente, o LED permanece ligado até o botão desligar ser acionado.</p>
      </div>

      <div class="admin-buttons">
        <button class="btn-primario" onclick="controlarLed('on')">Ligar LED</button>
        <button class="btn-secundario" onclick="controlarLed('off')">Desligar LED</button>
      </div>
    </section>

    <section class="bloco">
      <div class="bloco-topo">
        <h2>Leitura técnica dos sensores</h2>
      </div>
      <div class="cards-sensores" id="ultra-list"></div>
    </section>
  </main>

  <script>
    const tempEl = document.getElementById("admin-temp");
    const humEl = document.getElementById("admin-hum");
    const ledEl = document.getElementById("admin-led-status");
    const msgEl = document.getElementById("admin-msg");
    const ultraListEl = document.getElementById("ultra-list");

    function formatValue(value, suffix) {
      if (value === null || value === undefined) return `-- ${suffix}`;
      return `${value} ${suffix}`;
    }

    function renderUltrassons(sensores) {
      if (!Array.isArray(sensores) || sensores.length === 0) {
        ultraListEl.innerHTML = `<article class="card sensor-card"><h3>Sem dados</h3><p>Aguardando leituras.</p></article>`;
        return;
      }

      ultraListEl.innerHTML = "";

      sensores.forEach(sensor => {
        const card = document.createElement("article");
        card.className = `card sensor-card ${sensor.in_range ? "sensor-ativo" : ""}`;
        card.innerHTML = `
          <h3>${sensor.sensor}</h3>
          <p><strong>Distância:</strong> ${sensor.distance_cm !== null ? sensor.distance_cm + " cm" : "--"}</p>
          <p><strong>Aproximação:</strong> ${sensor.approaching ? "Sim" : "Não"}</p>
          <p><strong>Em alcance (<= 2 m):</strong> ${sensor.in_range ? "Sim" : "Não"}</p>
        `;
        ultraListEl.appendChild(card);
      });
    }

    async function carregarAdmin() {
      try {
        const respostaTecnica = await fetch("/admin-data");
        const data = await respostaTecnica.json();

        tempEl.textContent = formatValue(data.temperature, "°C");
        humEl.textContent = formatValue(data.humidity, "%");
        ledEl.textContent = data.led ? "Ligado" : "Desligado";
        msgEl.textContent = data.message || "Sem status";
        renderUltrassons(data.ultrassons);
      } catch (erro) {
        msgEl.textContent = "Falha na atualização";
        ultraListEl.innerHTML = `<article class="card sensor-card"><h3>Erro</h3><p>Falha ao carregar dados técnicos.</p></article>`;
      }
    }

    async function controlarLed(action) {
      const formData = new FormData();
      formData.append("action", action);

      const response = await fetch("/admin/led", {
        method: "POST",
        body: formData
      });

      const data = await response.json();

      if (data.ok) {
        ledEl.textContent = data.led ? "Ligado" : "Desligado";
        carregarAdmin();
      } else {
        alert("Erro ao controlar LED");
      }
    }

    carregarAdmin();
    setInterval(carregarAdmin, 1000);
  </script>
</body>
</html>
