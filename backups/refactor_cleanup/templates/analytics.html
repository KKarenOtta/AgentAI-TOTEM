<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h2>Analytics</h2>
<canvas id="chart"></canvas>

<script>
async function load() {
  const r = await fetch("/analytics/metrics");
  const data = await r.json();

  new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: ["Total", "Score Médio"],
      datasets: [{
        data: [data.total, data.avg_score]
      }]
    }
  });
}

load();
</script>

</body>
</html>
